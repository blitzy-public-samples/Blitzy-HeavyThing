# rustfmt.toml — Rustfmt configuration for the HeavyThing Rust workspace
#
# Only STABLE rustfmt options are permitted. Unstable options would emit
# "unstable features are only available in nightly channel" warnings on the
# stable toolchain pinned in rust-toolchain.toml, breaking the warning-clean
# build mandated by AAP §0.8.3 (Gate 2).
#
# Option reference: https://rust-lang.github.io/rustfmt/
# HeavyThing © 2015–2018 2 Ton Digital, Jeff Marrison — GPL-3.0-or-later.

# Rust edition matches Cargo.toml (AAP §0.6.3.4).
edition = "2021"

# 110 accommodates long match arms in TLS/SSH/HTTP protocol code without
# awkward line breaks (default is 100; readability degrades beyond 120).
max_width = 110

# 4-space indentation (Rust community standard); never hard tabs.
hard_tabs = false
tab_spaces = 4

# Always Unix-style LF (workspace is Linux-only per AAP §0.3.2.4).
newline_style = "Unix"

# Sort imports alphabetically; reorder top-level `mod` declarations canonically.
reorder_imports = true
reorder_modules = true

# Prefer `Foo { x, y }` over `Foo { x: x, y: y }`.
use_field_init_shorthand = true

# Intentionally OMITTED — verified unstable on rustfmt 1.9.0-stable:
#   trailing_comma, imports_granularity, group_imports, wrap_comments,
#   format_code_in_doc_comments, comment_width, normalize_comments,
#   condense_wildcard_suffixes, format_macro_matchers.
# Stable defaults already align with our intent (e.g., trailing_comma defaults
# to "Vertical"). Add explicit settings here only after verifying stability.
