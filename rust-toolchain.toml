# rust-toolchain.toml — Toolchain pin for the HeavyThing Rust workspace
#
# Read by `rustup` (and by `cargo` through rustup shim integration) to
# automatically install and select the correct Rust toolchain when any
# cargo command is invoked from this directory.
#
# See https://rust-lang.github.io/rustup/overrides.html for behavior details.

[toolchain]
# Channel: stable only (AAP §0.8.3 forbids nightly features).
channel = "stable"

# Components: rustfmt (formatting) + clippy (lints; config in clippy.toml).
components = ["rustfmt", "clippy"]

# Targets: Linux x86_64 only (AAP §0.3.2.4 constrains the scope to Linux).
targets = ["x86_64-unknown-linux-gnu"]

# Profile: minimal — no rust-docs or rust-src in CI (AAP §0.6.3.4).
profile = "minimal"
